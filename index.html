<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Croco Casino</title>
<meta name="description" content="Casino de démonstration à argent fictif : Plinko, roulette, blackjack, caisses CS et machine à sous, avec classement partagé.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=DM+Sans:opsz,wght@9..40,500;9..40,700;9..40,800&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/casino.css?v=m5">
<style>
.lobby { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 12px; align-items: start; }
.hero { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 10px 20px; padding: 22px 18px; border-radius: 12px; background: var(--panel); }
.hero h1 { margin: 0; font: clamp(20px, 4.4vw, 38px)/1.2 var(--font-pixel); }
.hero h1 span { color: var(--gold); }
.hero p { margin: 0; max-width: 46ch; color: var(--muted); line-height: 1.5; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(150px, 100%), 1fr)); gap: 10px; }
.tile { display: grid; gap: 10px; align-content: start; padding: 16px; border-radius: 12px; background: var(--panel); text-decoration: none; border: 2px solid transparent; transition: border-color 0.15s ease, transform 0.15s ease; }
.tile:hover { border-color: var(--gold); transform: translateY(-2px); }
.tile .px { width: 54px; height: 54px; }
.tile b { font: 12px/1.4 var(--font-pixel); }
.tile small { color: var(--muted); font-size: 12.5px; line-height: 1.4; }
.tile .rtp { color: var(--gold); font-weight: 800; font-size: 12px; }
.col { display: grid; gap: 12px; min-width: 0; }
.notice { margin: 0; display: flex; gap: 8px; padding: 10px 12px; border-radius: 10px; background: #3a2c06; color: var(--gold); font-size: 12.5px; font-weight: 700; line-height: 1.45; }
@media (max-width: 860px) { .lobby { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<main class="lobby">
  <section class="hero">
    <h1>CROCO <span>CASINO</span></h1>
    <p>Cinq jeux, un seul solde, un classement commun. Toutes les cotes sont affichées. Argent fictif uniquement.</p>
  </section>
  <div class="col">
    <nav class="tiles" id="tiles" aria-label="Jeux"></nav>
    <p class="notice"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true" style="flex:none;margin-top:1px"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/></svg>Simulation : aucun vrai argent, aucun vrai paiement. Sur la durée, chaque jeu reprend une partie des mises : le retour moyen est indiqué sur chaque jeu.</p>
    <section class="surface" aria-labelledby="feedTitle">
      <h2 class="h-label" id="feedTitle" style="margin-bottom:10px">En direct <span id="online" class="muted"></span></h2>
      <div id="feed"></div>
    </section>
  </div>
  <section class="board-arcade" id="board" aria-label="Classement"></section>
</main>
<script type="module">
import { casino, mountShell, $ } from './js/core.js';
import { mountBoard, mountFeed } from './js/widgets.js';
import { pixelIcon, GAME_INFO } from './js/icons.js';
import { rtp as slotsRtp } from './js/engine/slots.js';

mountShell('home');
const pct = (x) => new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 1 }).format(x * 100) + ' %';
const DESC = {
  plinko: ['Le croco tombe entre les clous.', 'Retour moyen ≈ 99 %'],
  roulette: ['Roulette européenne, tours partagés en ligne.', 'Retour moyen ' + pct(36 / 37)],
  blackjack: ['Bats le croupier sans dépasser 21.', 'Retour ≈ 99,5 % en jouant parfaitement'],
  cases: ['Vraies caisses CS2, vrais taux publiés.', 'Prix du marché'],
  slots: ['Trois rouleaux, cinq lignes.', 'Retour moyen ' + pct(slotsRtp())],
};
$('tiles').innerHTML = Object.entries(GAME_INFO).map(([g, info]) =>
  `<a class="tile" href="${info.href}">${pixelIcon(g, 54)}<b>${info.name.toUpperCase()}</b><small>${DESC[g][0]}</small><span class="rtp">${DESC[g][1]}</span></a>`).join('');
mountBoard($('board'), { limit: 10 });
mountFeed($('feed'), { limit: 10 });
const on = () => {
  const n = casino.onlineCount;
  $('online').textContent = casino.online && casino.status === 'online' ? `· ${n} joueur${n > 1 ? 's' : ''} actif${n > 1 ? 's' : ''}` : casino.online ? '' : '· mode solo';
  $('online').title = 'Joueurs différents qui ont joué dans les 5 dernières minutes';
};
casino.on('online', on).on('status', on); on();
</script>
</body>
</html>
