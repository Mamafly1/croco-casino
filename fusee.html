<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Croco Fusée</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#181818">
<link rel="icon" type="image/png" href="img/app/favicon.png">
<link rel="apple-touch-icon" href="img/app/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=DM+Sans:opsz,wght@9..40,500;9..40,700;9..40,800&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/casino.css?v=m34">
<style>
.sky { position: relative; width: 100%; height: clamp(250px, 62vw, 440px); border-radius: 12px; overflow: hidden; background: radial-gradient(120% 90% at 50% 100%, #2a1a40 0%, #0d0d18 70%); }
.sky canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.mult { position: absolute; left: 0; right: 0; top: 18%; text-align: center; font: clamp(28px, 7vw, 56px)/1 var(--font-pixel); color: var(--ink); text-shadow: 4px 4px 0 #000; pointer-events: none; }
.mult.boom { color: var(--red); }
.mult.cashed { color: var(--gold); }
.sub { position: absolute; left: 0; right: 0; top: calc(18% + clamp(40px, 9vw, 70px)); text-align: center; font-weight: 800; color: var(--muted); pointer-events: none; }
.skip { position: absolute; right: 10px; bottom: 10px; display: grid; place-items: center; padding: 6px 10px; border: 1px solid rgba(240,240,230,.25); border-radius: 8px; background: rgba(0,0,0,.35); color: var(--muted); cursor: pointer; }
.skip:hover { color: var(--ink); border-color: rgba(240,240,230,.5); }
.skip[hidden] { display: none; }
.points { display: flex; gap: 6px; flex-wrap: wrap; }
.points span { padding: 4px 8px; border-radius: 6px; background: var(--panel); font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; }
.points .lo { color: #ff8a84; }
.points .hi { color: var(--gold); }
.autorow { display: flex; gap: 6px; align-items: center; }
.autorow input { flex: 1; min-width: 0; }
</style>
</head>
<body>
<main class="game split">
  <aside class="panel" aria-label="Réglages de la mise">
    <button id="play" class="play" type="button">Lancer la fusée</button>
    <p class="msg" id="msg" aria-live="polite"></p>
    <div class="field bet-zone">
      <div class="field-head"><label for="bet">Mise</label><span class="num" id="betMax">max 0,00 €</span></div>
      <div class="betrow has-auto">
        <input id="bet" type="text" inputmode="decimal" value="1,00" autocomplete="off">
        <button id="half" type="button" aria-label="Diviser la mise par deux">½</button>
        <button id="double" type="button" aria-label="Doubler la mise">2×</button>
        <button id="autoBtn" class="auto-btn" type="button" aria-expanded="false" aria-controls="autoBox" title="Retrait automatique">AUTO</button>
      </div>
    </div>
    <div class="field bet-zone" id="autoBox" hidden>
      <div class="field-head"><label for="auto">Retrait automatique à ×</label><span class="muted small">vide = à la main</span></div>
      <div class="autorow"><input class="text-in" id="auto" type="text" inputmode="decimal" placeholder="ex. 2,00" autocomplete="off"></div>
    </div>
    <section class="stats" aria-label="Statistiques">
      <h2>Session</h2>
      <dl class="stat-grid">
        <div><dt>Vols</dt><dd id="sCount">0</dd></div>
        <div><dt>Profit</dt><dd id="sProfit">0,00 €</dd></div>
        <div><dt>Total misé</dt><dd id="sWager">0,00 €</dd></div>
        <div><dt>Meilleur</dt><dd id="sBest">–</dd></div>
      </dl>
      <details class="odds"><summary><h2>Les vraies cotes</h2></summary>
        <p class="odds-note" id="oddsNote"></p>
      </details>
    </section>
  </aside>
  <section class="stage" aria-label="Fusée">
    <div class="sky" id="sky"><canvas id="cv" aria-hidden="true"></canvas><div class="mult" id="mult" aria-live="off">×1,00</div><div class="sub" id="sub"></div><button id="skip" class="skip" type="button" hidden aria-label="Accélérer la fin du vol"><svg viewBox="0 0 16 10" width="20" height="13" aria-hidden="true"><path d="M1 1l6 4-6 4zM8 1l6 4-6 4z" fill="currentColor"/></svg></button></div>
    <div class="points" id="points" aria-label="Dernières explosions"></div>
    <section class="surface" aria-labelledby="feedTitle">
      <h2 class="h-label" id="feedTitle" style="margin-bottom:10px">Fusée en direct</h2>
      <div id="feed"></div>
    </section>
  </section>
</main>
<script type="module" src="js/pages/fusee.js?v=m34"></script>
</body>
</html>
