# Envoie le serveur multijoueur sur Cloudflare depuis GitHub : rien à installer sur ton PC.
# Il faut une seule fois ajouter deux secrets au dépôt (voir server/README.md) :
#   CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID
name: Déployer le serveur

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'js/engine/**'
      - 'data/cases.json'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
      KLIPY_KEY: ${{ secrets.KLIPY_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier que les secrets existent
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Ajoute le secret CLOUDFLARE_API_TOKEN au dépôt (voir server/README.md)."
            exit 1
          fi
      # Les clés (ADMIN_KEY pour admin.html, KLIPY_KEY pour la recherche de gifs) sont envoyées AVANT la mise en ligne,
      # dans la même étape : la mise en ligne reste la dernière opération, avec la base de données branchée.
      # (Envoyer les clés après coup créait une version du serveur sans sa base : plus personne ne pouvait se connecter.)
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          command: deploy
          secrets: |
            ADMIN_KEY
            KLIPY_KEY
