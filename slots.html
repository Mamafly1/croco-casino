<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Croco Slots</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=DM+Sans:opsz,wght@9..40,500;9..40,700;9..40,800&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/casino.css">
<style>
.machine { position: relative; padding: 18px; border-radius: 16px; background: linear-gradient(180deg, #3a0a0a, #1e0505); border: 3px solid var(--red); box-shadow: inset 0 0 0 3px #181818, inset 0 0 0 5px var(--gold); }
.machine h1 { margin: 2px 0 14px; text-align: center; font: clamp(16px, 3.4vw, 26px)/1.2 var(--font-pixel); color: var(--gold); text-shadow: 3px 3px 0 var(--red); }
.window { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 8px; border-radius: 10px; background: #0d0d0d; }
.reel { position: relative; height: calc(var(--cell) * 3); overflow: hidden; border-radius: 8px; background: linear-gradient(180deg, #d9d9cf, #f0f0e6 20%, #f0f0e6 80%, #c9c9bd); }
.strip { position: absolute; left: 0; right: 0; top: 0; will-change: transform; }
.cell { height: var(--cell); display: grid; place-items: center; }
.cell .sym { width: 72%; height: 72%; }
.cell.win { animation: pulse 0.6s ease 3; }
@keyframes pulse { 50% { transform: scale(1.12); } }
.lines { position: absolute; inset: 8px; pointer-events: none; }
.lines path { fill: none; stroke: var(--gold); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 4px #000); }
.lights { display: flex; justify-content: center; gap: 10px; margin-top: 12px; }
.lights i { width: 10px; height: 10px; border-radius: 50%; background: var(--gold); opacity: 0.35; }
.machine.spinning .lights i { animation: blink 0.5s steps(2) infinite; }
.lights i:nth-child(2n) { animation-delay: 0.25s !important; }
@keyframes blink { 50% { opacity: 1; } }
.result { min-height: 26px; margin: 10px 0 0; text-align: center; font: 13px/1.6 var(--font-pixel); color: var(--ink); }
.result.big { color: var(--gold); }
.paytable { width: 100%; border-collapse: collapse; font-size: 13px; }
.paytable td { padding: 5px 4px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.paytable td:first-child { display: flex; gap: 2px; align-items: center; }
.paytable .sym { width: 22px; height: 22px; }
.paytable td.r { text-align: right; }
.paytable td.m { color: var(--muted); text-align: right; }
</style>
</head>
<body>
<main class="game split">
  <aside class="panel" aria-label="Réglages de la mise">
    <div class="field">
      <div class="field-head"><label for="bet">Mise totale (5 lignes)</label><span class="num" id="betMax">max 0,00 €</span></div>
      <div class="betrow">
        <input id="bet" type="text" inputmode="decimal" value="1,00" autocomplete="off">
        <button id="half" type="button" aria-label="Diviser la mise par deux">½</button>
        <button id="double" type="button" aria-label="Doubler la mise">2×</button>
      </div>
    </div>
    <div class="field">
      <div class="field-head"><span id="autoLabel">Tours automatiques</span></div>
      <div class="chips" id="autoCount" role="group" aria-labelledby="autoLabel">
        <button type="button" data-n="1" aria-pressed="true">1</button>
        <button type="button" data-n="10" aria-pressed="false">10</button>
        <button type="button" data-n="25" aria-pressed="false">25</button>
        <button type="button" data-n="50" aria-pressed="false">50</button>
      </div>
    </div>
    <button id="play" class="play" type="button">Lancer</button>
    <p class="msg" id="msg" aria-live="polite"></p>
    <section class="stats" aria-label="Statistiques">
      <h2>Session</h2>
      <dl class="stat-grid">
        <div><dt>Tours</dt><dd id="sCount">0</dd></div>
        <div><dt>Profit</dt><dd id="sProfit">0,00 €</dd></div>
        <div><dt>Total misé</dt><dd id="sWager">0,00 €</dd></div>
        <div><dt>Meilleur</dt><dd id="sBest">–</dd></div>
      </dl>
      <h2>Les vraies cotes</h2>
      <p class="odds-note" id="oddsNote"></p>
      <table class="paytable" id="paytable" aria-label="Table des gains"></table>
    </section>
  </aside>
  <section class="stage" aria-label="Machine à sous">
    <div class="machine" id="machine">
      <h1>CROCO SLOTS</h1>
      <div class="window" id="window">
        <div class="reel"><div class="strip"></div></div>
        <div class="reel"><div class="strip"></div></div>
        <div class="reel"><div class="strip"></div></div>
        <svg class="lines" id="lines" aria-hidden="true"></svg>
      </div>
      <div class="lights" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <p class="result" id="result" aria-live="polite"></p>
    </div>
    <section class="surface" aria-labelledby="feedTitle">
      <h2 class="h-label" id="feedTitle" style="margin-bottom:10px">Machine à sous en direct</h2>
      <div id="feed"></div>
    </section>
  </section>
</main>
<script type="module" src="js/pages/slots.js"></script>
</body>
</html>
